[project]
name = "wonder-supplychain-graph"
revision = "1.0"

[profiles.default]
FORGE_PRODUCT = { description = "Forge product (jira, confluence, compass, jsm)", default = "jira" }
FORGE_ENVIRONMENT = { description = "Forge environment name", default = "development" }

# Local-only inputs for the controlled two-tenant demo. Generated webtrigger
# URLs are development capabilities and must not be committed or uploaded as
# Forge variables.
SCG_SOURCE_SITE = { description = "Source Jira site hostname, e.g. source-example.atlassian.net", required = true }
SCG_DESTINATION_SITE = { description = "Destination Jira site hostname, e.g. destination-example.atlassian.net", required = true }
# The harness validates these as non-empty immediately before it runs. Empty
# defaults let the paired install complete before webtriggers and demo Epics exist.
SCG_DESTINATION_SEED_URL = { description = "Destination scg-seed-destination webtrigger URL", default = "" }
SCG_DESTINATION_DELIVERY_URL = { description = "Destination scg-receive-starter webtrigger URL", default = "" }
SCG_DESTINATION_EVENT_URL = { description = "Destination lean-event webtrigger URL", default = "" }
SCG_DESTINATION_AUTOMATION_WEBHOOK_URL = { description = "Destination Jira Automation incoming-webhook URL", default = "" }
SCG_SOURCE_SITE_ARI = { description = "Source Jira site ARI for lean CloudEvents", default = "" }
SCG_SOURCE_SEED_URL = { description = "Source scg-seed-source webtrigger URL", default = "" }
SCG_SOURCE_PUBLICATION_URL = { description = "Source scg-publish-starter webtrigger URL", default = "" }
SCG_PAIRING_ID = { description = "Non-secret identifier shared by the source and destination demo Pairings", default = "" }
SCG_SOURCE_EPIC_KEY = { description = "Source Jira Epic issue key to publish", default = "" }
SCG_PAIRED_EPIC_KEY = { description = "Destination Jira Epic issue key retained as Pairing metadata", default = "" }

# Declare your app's secrets here. Any key containing SECRET is pushed to
# Forge as an encrypted variable by `npm run forge:variables:set:secretspec`.
# MY_APP_SECRET = { description = "...", required = true }
