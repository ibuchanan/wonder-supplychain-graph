[project]
name = "wonder-supplychain-graph"
revision = "1.0"

[profiles.default]
FORGE_PRODUCT = { description = "Forge product (jira, confluence, compass, jsm)", default = "jira" }
FORGE_ENVIRONMENT = { description = "Forge environment name", default = "development" }

# Local-only two-site selectors, required by install/upgrade/uninstall, not lint.
# FORGE_SITE is supplied by the two-site adapter, not resolved from the provider.
SCG_SOURCE_SITE = { description = "Source demo site hostname", required = false }
SCG_DESTINATION_SITE = { description = "Destination demo site hostname", required = false }

# Shared development-only secret for RFC-141-compatible peer request signing.
# It must be base64-encoded and decode to 32–64 random bytes.
SHARED_SECRET = { description = "Base64-encoded 32–64 byte shared secret for peer HMAC authentication", required = true }

# Only these names are uploaded. Fence Rider encrypts every selected value.
[scopes.runtime]
secrets = ["SHARED_SECRET"]
