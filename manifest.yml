app:
  id: ari:cloud:ecosystem::app/5c6de3cf-cb86-4873-8621-3f28f2537757
  runtime:
    architecture: arm64
    memoryMB: 256
    name: nodejs24.x
modules:
  rovo:agent:
    - key: scg-package-agent
      name: Supplychain Graph
      description: Find the current Supplychain Graph package and add attributable comments to its originating Epic.
      actions:
        - scg-comment-origin
      conversationStarters:
        - Add a comment about the current Supplychain Graph package to its originating Epic.
      prompt: You help users comment on the originating Epic for a current Supplychain Graph package. Use the Comment on originating Epic action when the user provides comment text. Never ask the user for, infer, or accept a connection ID or destination issue key; the action resolves both from tenant-local current-package provenance. Explain failures precisely and do not claim a comment was created unless the action confirms it.
  action:
    - key: scg-publish-package
      name: Publish work package
      description: Queues a governed work-package publication for a Source Epic.
      actionVerb: CREATE
      config:
        render: native
        resource: publish-package-config
      function: publishWorkPackage
      inputs:
        publisherId:
          title: Publisher account ID
          description: The Automation publisher account ID.
          required: true
          type: string
        sourceEpicId:
          title: Source Epic ID
          description: The Source Epic key, for example {{issue.key}}.
          required: true
          type: string
      resolver:
        function: getActionConfig
    - key: scg-publish-package-graph
      name: Publish package to Rovo demo
      description: Promotes and indexes the current demo work package for Rovo discovery.
      actionVerb: CREATE
      config:
        render: native
        resource: publish-graph-config
      function: publishPackageToGraph
      inputs:
        publisherId:
          title: Publisher account ID
          description: The Automation publisher account ID.
          required: true
          type: string
        sourceEpicId:
          title: Source Epic ID
          description: The Source Epic key, for example {{issue.key}}.
          required: true
          type: string
      resolver:
        function: getActionConfig
    - key: scg-comment-origin
      name: Comment on originating Epic
      description: Adds a package-related comment to the Source Epic resolved from current package provenance.
      actionVerb: CREATE
      function: commentOriginEpic
      inputs:
        commentText:
          title: Comment text
          description: The package-related comment to add to the originating Epic.
          required: true
          type: string
  automation:actionProvider:
    - key: scg-publish-package-provider
      actions:
        - scg-publish-package
        - scg-publish-package-graph
  graph:connector:
    - key: scg-package-connector
      name: Supplychain Graph Package
      capabilities:
        replicatesPermissions: false
        supportsIncrementalSync: false
        syncFidelity: mirror
      datasource:
        onConnectionChange:
          function: onConnectionChange
      icons:
        dark: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
        light: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
      objectTypes:
        - atlassian:work-item
        - atlassian:document
  jira:adminPage:
    - key: scg-poc-readiness
      title: Supplychain Graph Peer POC readiness
      render: native
      resolver:
        function: getActionConfig
      resource: poc-readiness
    - key: scg-peer-invitations
      title: Supplychain Graph Peer invitations
      render: native
      resolver:
        function: getActionConfig
      resource: peer-invitations
      useAsConfig: true
  jira:globalPage:
    - key: scg-simulator
      title: Supplychain Graph Simulator
      render: native
      resource: simulator
  jira:issuePanel:
    - key: scg-epic-panel
      title: Supplychain Graph
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
      render: native
      resource: main
  trigger:
    - key: scg-on-installed
      events:
        - avi:forge:installed:app
      function: onInstalled
    - key: scg-on-upgraded
      events:
        - avi:forge:upgraded:app
      function: onUpgraded
  webtrigger:
    - key: scg-receive-peer-event
      function: receivePeerEvent
      response:
        type: dynamic
      urlFormat: v2
    - key: scg-receive-bootstrap-request
      function: receiveBootstrapRequest
      response:
        type: dynamic
      urlFormat: v2
  function:
    - key: onConnectionChange
      handler: index.onPackageConnectionChange
    - key: publishWorkPackage
      handler: index.publishWorkPackage
    - key: publishPackageToGraph
      handler: index.publishPackageToGraph
    - key: commentOriginEpic
      handler: index.commentOriginEpic
    - key: getActionConfig
      handler: resolvers/index.handler
    - key: onInstalled
      handler: index.onInstalled
    - key: onUpgraded
      handler: index.onUpgraded
    - key: receivePeerEvent
      handler: index.receivePeerEvent
    - key: receiveBootstrapRequest
      handler: index.receiveBootstrapRequest
permissions:
  external:
    fetch:
      backend:
        - address: '*.execute-api.ap-southeast-2.amazonaws.com'
          inScopeEUD: false
        - address: '*.execute-api.eu-central-1.amazonaws.com'
          inScopeEUD: false
        - address: '*.execute-api.us-east-1.amazonaws.com'
          inScopeEUD: false
        - address: automation.atlassian.com
          inScopeEUD: false
  scopes:
    - delete:object:jira
    - read:object:jira
    - storage:app
    - write:object:jira
    - write:jira-work
    - read:jira-work
resources:
  - key: main
    path: src/frontend/index.tsx
  - key: simulator
    path: src/frontend/simulator.tsx
  - key: poc-readiness
    path: src/frontend/poc-readiness.tsx
  - key: publish-package-config
    path: src/frontend/publish-package-action-config.tsx
  - key: publish-graph-config
    path: src/frontend/publish-graph-action-config.tsx
  - key: peer-invitations
    path: src/frontend/peer-invitations.tsx
